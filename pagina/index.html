<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Minha Página de Links</title>
  <link rel="stylesheet" href="style-1.css">
</head>
<body>
  <main class="page">
    <section class="profile">
      <div class="avatar-wrap">
        <img class="avatar" src="WhatsApp Image 2026-09-01 at 13.11.11.jpeg" alt="Foto de perfil">
      </div>

      <h1>Gabriela Soares</h1>
      <p class="subtitle">Todos os meus links aqui <span>👇</span></p>
    </section>

    <section class="links" aria-label="Meus links">
      <!-- Cada cartão abaixo é um link independente. Troque apenas o href. -->
      <a class="link-card" href="https://privacy.com.br/profile/gabioculta" target="_blank" rel="noopener noreferrer">
        <img src="WhatsApp Image 2026-09-01 at 13.22.20.jpeg" alt="" class="thumb">
        <span>PRIVACY (15% OFF)</span>
        <span class="lock">♙</span>
      </a>

      <a class="link-card" href="https://x.com/Gabriela_oculta" target="_blank" rel="noopener noreferrer">
        <img src="WhatsApp Image 2026-09-01 at 13.23.01.jpeg" alt="" class="thumb">
        <span>X/Twitter (Conteúdos exclusivos)</span>
        <span class="dots">⋮</span>
      </a>

    </section>

    <footer>
      <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <span>•</span>
        <a href="#">Report</a>
      </div>
      <div class="footer-links">
        <a href="#">Explore</a>
        <span>•</span>
        <a href="#">About this account</a>
        <span>•</span>
        <a href="#">More</a>
      </div>
      <p>Junte-se a nós hoje</p>
    </footer>
  </main>

  <script src="script-1.js"></script>
</body>
</html>
